# The part of the CI build that is the same for every Yocto release. The
# <release>.yml files include it and add the layers of their release.

header:
  version: 14

distro: poky
target:
  - swift-cxx-interop-test
  # The SDK, with the Swift compiler for the SDK host (nativesdk-swift).
  # ci/test-sdk.sh then compiles a program with it.
  - core-image-minimal:do_populate_sdk
  # The image the CI boots in QEMU for the runtime tests (testimage).
  - core-image-minimal

repos:
  # This repository. The layer is at its root.
  meta-swift:

# Several LLVM builds (swift-llvm-native, nativesdk-swift-llvm,
# swift-bootstrap-llvm-native) compile at the same time, at up to 2 GB per C++
# compiler process. With the bitbake defaults (one task and one make job per
# CPU) a 40-CPU runner with 64 GB of RAM ran out of memory. These defaults fit
# that runner.
# A smaller one sets META_SWIFT_BB_NUMBER_THREADS and META_SWIFT_PARALLEL_MAKE
# in the .env file of the runner, see .github/workflows/build.yml.
env:
  BB_NUMBER_THREADS: "8"
  PARALLEL_MAKE: "-j16"

local_conf_header:
  meta-swift: |
    require conf/distro/include/swift-toolchain.inc
  ci: |
    INHERIT += "rm_work"
    # The builds on a runner share SSTATE_DIR. Keep the hash equivalence
    # database with it, so that they also share the equivalences.
    BB_HASHSERVE_DB_DIR = "${SSTATE_DIR}"
    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K"
  # The runtime tests of the CI: bitbake core-image-minimal -c testimage
  # boots the image in QEMU, logs in over ssh and runs the ptest of
  # swift-cxx-interop-test, then the program that ci/test-sdk.sh compiled
  # with the SDK. slirp networking needs no root rights and no tap devices.
  # scp in the kas container uses the SFTP protocol, hence openssh with its
  # sftp-server instead of dropbear. rm_work would remove the work directory
  # of the image once the image is built, while do_populate_sdk of the same
  # recipe may still install from the package repository in it.
  qemu-test: |
    IMAGE_CLASSES += "testimage"
    RM_WORK_EXCLUDE += "core-image-minimal"
    IMAGE_FEATURES:append:pn-core-image-minimal = " ssh-server-openssh allow-empty-password empty-root-password allow-root-login"
    IMAGE_INSTALL:append:pn-core-image-minimal = " openssh-sftp-server ptest-runner swift-cxx-interop-test-ptest swift-foundation"
    TEST_SUITES = "ping ssh ptest swift_sdk"
    TEST_RUNQEMUPARAMS = "slirp nographic"
    # testimage uses KVM for an x86 image on an x86 host, but the runners
    # are not expected to provide /dev/kvm. QEMU always emulates.
    QEMU_USE_KVM = "0"
    QB_MEM = "-m 1024"
    SWIFT_SDK_TEST_PROGRAM = "${TOPDIR}/sdk-test-programs/hello"
    # testimage reads the variables from the testdata.json of the image, which
    # is only written when the image is built. Take the current value.
    TESTIMAGE_UPDATE_VARS:append = " SWIFT_SDK_TEST_PROGRAM"
