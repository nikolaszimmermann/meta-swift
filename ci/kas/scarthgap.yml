# CI build of the Swift toolchain on scarthgap with meta-clang. The machine is
# set by the scarthgap-<machine>.yml files that include this one.
#
# poky and meta-clang are pinned to the revisions of the WebKit Yocto manifest
# (Tools/yocto/rpi/manifest.xml), the combination this layer is tested with.

header:
  version: 14

distro: poky
target:
  - swift-cxx-interop-test

repos:
  # This repository; the layer is at its root.
  meta-swift:

  poky:
    url: https://git.yoctoproject.org/poky
    branch: scarthgap
    commit: d4576e3c081a7ee7b57d48421c4c4f491cb4defe
    layers:
      meta:
      meta-poky:

  meta-clang:
    url: https://github.com/kraj/meta-clang.git
    branch: scarthgap-clang20
    commit: f26bab34e6c208149fe1ad04521864b663489f4d

# Several LLVM builds (clang-native, swift-bootstrap-llvm-native, the cross
# clang) compile at the same time, at up to 2 GB per C++ compiler process.
# With the bitbake defaults (one task and one make job per CPU) a 40-CPU
# runner with 64 GB of RAM ran out of memory. These defaults fit that runner.
# A smaller one sets META_SWIFT_BB_NUMBER_THREADS and META_SWIFT_PARALLEL_MAKE
# in the .env file of the runner, see .github/workflows/build.yml.
env:
  BB_NUMBER_THREADS: "8"
  PARALLEL_MAKE: "-j16"

local_conf_header:
  meta-swift: |
    require conf/distro/include/swift-toolchain.inc
  ci: |
    INHERIT += "rm_work"
    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K"
