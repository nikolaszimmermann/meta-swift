# CI build of the Swift toolchain on scarthgap with meta-clang. The machine is
# set by the scarthgap-<machine>.yml files that include this one.
#
# poky and meta-clang are pinned to the revisions of the WebKit Yocto manifest
# (Tools/yocto/rpi/manifest.xml), the combination this layer is tested with.

header:
  version: 14
  includes:
    - ci/kas/common.yml

repos:
  poky:
    url: https://git.yoctoproject.org/poky
    branch: scarthgap
    commit: d4576e3c081a7ee7b57d48421c4c4f491cb4defe
    layers:
      meta:
      meta-poky:

  meta-clang:
    url: https://github.com/kraj/meta-clang.git
    branch: scarthgap-clang20
    commit: f26bab34e6c208149fe1ad04521864b663489f4d

env:
  # Recipes whose task hashes must not change when the Swift toolchain is
  # enabled, see ci/check-isolation.sh: some that use the distro compiler and
  # the clang of meta-clang itself.
  SWIFT_ISOLATION_TARGETS: "glib-2.0 gtk4 mesa gstreamer1.0 clang"

local_conf_header:
  # The kas container runs Debian 13, which scarthgap predates and does not
  # list as a tested host. The CI builds on it fine, so add it and avoid the
  # warning in every build.
  scarthgap-host: |
    SANITY_TESTED_DISTROS:append = " \n debian-13 \n"
