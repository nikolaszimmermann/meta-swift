# oelint-adv configuration, read from the working directory: run oelint-adv
# from the top of the layer (see .github/workflows/lint.yml).
[oelint]
release = scarthgap
hide = info
relpaths = True
quiet = True
# Variables of this layer and of meta-clang, and the swiftllvm override that
# conf/distro/include/swift-toolchain.inc adds.
constantmods = +.oelint-constants.json
# Rules that do not fit this layer:
# - inappclassoverride: classes and include files carry :class-native and
#   :class-nativesdk variants for the recipes that use them with BBCLASSEXTEND.
# - var.override: include files set defaults that recipes override.
# - bbclass.underscores: renaming the classes would break every recipe that
#   inherits them.
# - fileextrapaths, outofcontext: recipes share patch directories through
#   FILESEXTRAPATHS.
# - noanonpython: recipes skip unsupported classes and compute values at parse
#   time.
# - filesoverride: the Swift runtime recipes list the files of each package
#   explicitly, instead of the defaults for C libraries.
# - dependsordered: it checks the entries of the include files and the recipe
#   together, as one list.
# - noncoreoverride: the Yocto Project Compatible rule for settings that
#   depend on a MACHINE or DISTRO; this layer configures no machine or distro.
# - patchsignedoff: OE-core requires Upstream-Status (patch-status QA), which
#   every patch has. A Signed-off-by is the patch author's to add.
suppress =
    oelint.vars.inappclassoverride
    oelint.var.override
    oelint.bbclass.underscores
    oelint.vars.fileextrapaths
    oelint.vars.outofcontext
    oelint.task.noanonpython
    oelint.var.filesoverride
    oelint.vars.dependsordered
    oelint.vars.noncoreoverride
    oelint.file.patchsignedoff
