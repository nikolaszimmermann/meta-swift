name: lint

# oelint-adv on the recipes, appends and classes. Cheap, so it runs on
# GitHub-hosted runners. Findings show up as annotations on the pull request or
# commit and fail the job. The configuration, including the rules this layer
# suppresses, is in .oelint.cfg; suppress a single finding with a
# "# nooelint: <rule>" comment on the line before it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  oelint-adv:
    runs-on: ubuntu-24.04
    env:
      # Pinned so that CI and local runs agree: a different version changes
      # which rules fire.
      OELINT_ADV_VERSION: "9.6.1"
    steps:
      - uses: actions/checkout@v7

      - name: Install oelint-adv
        run: pipx install "oelint-adv==$OELINT_ADV_VERSION"

      - name: Run oelint-adv
        # From the top of the layer, where oelint-adv reads .oelint.cfg.
        run: |
          find . -path ./.git -prune -o -type f \
            \( -name '*.bb' -o -name '*.bbappend' -o -name '*.bbclass' \) -print0 |
            sort -z | xargs -0 oelint-adv \
              --messageformat '::{severity} file={path},line={line},title={id}::{msg}'
