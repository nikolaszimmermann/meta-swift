# The Swift release this layer builds. Bump SWIFT_VERSION together with
# SWIFT_LLVM_* (from cmake/Modules/LLVMVersion.cmake of the swiftlang LLVM fork
# at the same tag, and the commit of that tag) and the SRCREVs in
# recipes-devtools/swift/swift-version.inc.
SWIFT_VERSION = "6.4.2"
SWIFT_TAG = "swift-${SWIFT_VERSION}-RELEASE"

SWIFT_LLVM_MAJOR_VER = "21"
SWIFT_LLVM_MINOR_VER = "1"
SWIFT_LLVM_PATCH_VER = "6"
# swift-6.4.2-RELEASE of swiftlang/llvm-project
SWIFT_LLVM_SRCREV = "fb5f84d903a3b4e7aea15cd5666598a46f56c833"
