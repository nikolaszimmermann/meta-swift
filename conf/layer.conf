# meta-swift: the Swift toolchain built from source on top of the
# meta-clang (scarthgap, walnascar) or OE-core (whinlatter and later) LLVM.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "swift-layer"
BBFILE_PATTERN_swift-layer := "^${LAYERDIR}/"
BBFILE_PRIORITY_swift-layer = "8"

LAYERVERSION_swift-layer = "1"
LAYERDEPENDS_swift-layer = "core"
LAYERRECOMMENDS_swift-layer = "clang-layer"
LAYERSERIES_COMPAT_swift-layer = "scarthgap walnascar whinlatter wrynose"

# Licenses that the recipes use but older OE-core releases lack: Unicode-3.0
# is in OE-core from styhead on, so scarthgap needs it from here. Without the
# text, do_create_spdx fails.
LICENSE_PATH += "${LAYERDIR}/files/common-licenses"

# Up to walnascar the clang recipes live in meta-clang, from whinlatter on in
# OE-core (which then also has a separate llvm recipe). Pick the matching set
# of bbappends so that none of them dangles. LAYERSERIES_CORENAMES is not
# visible while layer.conf files are parsed, so look at OE-core itself.
SWIFT_LLVM_IN_OECORE := "${@'1' if any(os.path.exists(os.path.join(p, 'recipes-devtools/clang/llvm_git.bb')) for p in (d.getVar('BBPATH') or '').split(':') if p) else '0'}"
BBFILES_DYNAMIC += "${@'clang-layer:${LAYERDIR}/llvm-integration/meta-clang/*/*.bbappend' if d.getVar('SWIFT_LLVM_IN_OECORE') == '0' else ''}"
BBFILES += "${@'${LAYERDIR}/llvm-integration/oe-core/*/*.bbappend' if d.getVar('SWIFT_LLVM_IN_OECORE') == '1' else ''}"

require conf/swift-version.conf
